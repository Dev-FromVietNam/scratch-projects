<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ví dụ: Nút đếm lời chào</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <a class="back" href="../../">← Về trang chủ</a>
    <h1>Xin chào! 👋</h1>
    <p>Đây là ý tưởng mẫu. Nhập tên rồi bấm nút nhé.</p>
    <label for="name">Tên của bạn</label>
    <input id="name" type="text" placeholder="Tên của bạn">
    <button id="greet" type="button">Chào tôi</button>
    <p id="message" aria-live="polite"></p>
    <p class="count">Đã chào <span id="count">0</span> lần</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
